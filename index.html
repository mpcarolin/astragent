<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASTRAGENT</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #scene {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      gap: 1rem;
      padding: 0.35rem 0.75rem;
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      background: rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    #hud .axis-x {
      color: #ff5555;
    }

    #hud .axis-y {
      color: #55ff55;
    }

    #hud .axis-z {
      color: #5599ff;
    }

    #hud .rate {
      color: #cccccc;
    }

    #labels {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .label {
      transform: translateY(-0.5rem);
      font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.08em;
      color: #cfd8ea;
      text-shadow: 0 0 4px #000, 0 0 8px #000;
      white-space: nowrap;
      cursor: pointer;
      pointer-events: auto;
    }

    .label:hover {
      color: #ffffff;
    }

    .bubble {
      max-width: min(18rem, 40vw);
      padding: 0.6rem 1.75rem 0.6rem 0.75rem;
      font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.08em;
      color: #cfd8ea;
      background: rgba(10, 14, 26, 0.75);
      border: 1px solid rgba(207, 216, 234, 0.35);
      border-radius: 0.25rem;
      pointer-events: none;
    }

    .bubble h2 {
      margin: 0 0 0.35rem;
      font: inherit;
      font-size: 1.1em;
      color: #ffffff;
    }

    .bubble p {
      margin: 0;
      line-height: 1.4;
    }

    .bubble button {
      position: absolute;
      top: 0.25rem;
      right: 0.4rem;
      border: none;
      background: none;
      color: inherit;
      font: inherit;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      pointer-events: auto;
    }
  </style>
</head>

<body>
  <canvas id="scene"></canvas>
  <div id="hud">
    <span id="hud-x" class="axis-x">x <output></output></span>
    <span id="hud-y" class="axis-y">y <output></output></span>
    <span id="hud-z" class="axis-z">z <output></output></span>
    <span id="hud-rx" class="axis-x">rx <output></output></span>
    <span id="hud-ry" class="axis-y">ry <output></output></span>
    <span id="hud-rz" class="axis-z">rz <output></output></span>
    <span id="hud-rate" class="rate">rate <output></output></span>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
